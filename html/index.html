<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CCD Monitor</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070a0e;
      --surface: #080f16;
      --line: #183044;
      --text: #dbe8ef;
      --muted: #728799;
      --accent: #02bcf1;
      --danger: #d66c73;
      --warning: #d8ad62;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-feature-settings: "tnum";
    }

    header {
      height: 48px;
      border-bottom: 1px solid var(--line);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(1500px, 100%);
      height: 100%;
      margin: 0 auto;
      padding: 0 16px;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--danger);
    }

    .status[data-state="connected"] .status-dot {
      background: var(--accent);
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1.65fr) minmax(320px, 1fr);
      align-items: start;
      gap: 18px;
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: 12px 16px 20px;
    }

    .panel {
      min-width: 0;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 32px;
    }

    .panel-header h2 {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .panel-meta {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .camera-panel {
      padding: 0 12px 12px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--surface);
    }

    .camera-state {
      color: var(--muted);
    }

    .camera-state[data-state="running"] {
      color: var(--accent);
    }

    .camera-state[data-state="paused"] {
      color: var(--warning);
    }

    .camera-state[data-state="error"] {
      color: var(--danger);
    }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px 10px;
      padding-top: 5px;
    }

    .control-field {
      display: grid;
      gap: 4px;
      min-width: 0;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.02em;
    }

    .control-field select,
    .control-field input,
    .camera-actions button,
    .apply-button {
      min-width: 0;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: #0b151e;
      color: var(--text);
      font: inherit;
    }

    .control-field select,
    .control-field input {
      width: 100%;
      padding: 0 9px;
      outline: none;
    }

    .control-field select:focus,
    .control-field input:focus {
      border-color: var(--accent);
    }

    .camera-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 11px;
    }

    .camera-actions button,
    .apply-button {
      padding: 0 10px;
      cursor: pointer;
    }

    .camera-actions button:hover:not(:disabled),
    .apply-button:hover:not(:disabled) {
      border-color: var(--accent);
      color: #fff;
    }

    .camera-actions button:disabled,
    .apply-button:disabled,
    .control-field select:disabled,
    .control-field input:disabled {
      cursor: default;
      opacity: 0.45;
    }

    .apply-button {
      width: 100%;
      margin-top: 8px;
      border-color: #12627a;
      background: #083142;
    }

    .camera-message {
      min-height: 18px;
      padding-top: 7px;
      color: var(--muted);
      font-size: 11px;
    }

    .camera-message[data-state="error"] {
      color: var(--danger);
    }

    .visual {
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 4px;
    }

    .image-visual {
      min-height: 0;
    }

    #camera-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .array-wrap {
      min-height: 0;
    }

    .side-column {
      display: grid;
      gap: 18px;
      min-width: 0;
    }

    #array-canvas {
      display: block;
      width: min(100%, 680px);
      height: auto;
      border-radius: 4px;
      image-rendering: pixelated;
    }

    .histogram-wrap {
      padding: 6px 8px 3px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--surface);
    }

    #histogram-canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .stats {
      display: flex;
      justify-content: flex-end;
      gap: 16px;
      padding: 7px 2px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .stat-value {
      margin-left: 4px;
      color: var(--text);
      font-weight: 400;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 900px) {
      .topbar {
        padding: 0 12px;
      }

      main {
        grid-template-columns: 1fr;
        padding: 6px 12px 12px;
      }

    }

    /* Modern dashboard layout */
    :root {
      --bg: #05080c;
      --surface: rgb(13 20 28 / 88%);
      --surface-raised: #101a24;
      --line: #213242;
      --text: #e5edf3;
      --muted: #8193a2;
      --accent: #20c8f4;
    }

    body {
      background:
        radial-gradient(circle at 15% -10%, rgb(24 87 112 / 22%), transparent 34rem),
        radial-gradient(circle at 95% 5%, rgb(27 65 88 / 18%), transparent 30rem),
        var(--bg);
    }

    header {
      position: sticky;
      z-index: 10;
      top: 0;
      height: 60px;
      border-color: rgb(45 67 83 / 72%);
      background: rgb(5 8 12 / 78%);
      backdrop-filter: blur(18px);
    }

    .topbar {
      width: min(1680px, 100%);
      padding: 0 24px;
    }

    h1 {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      letter-spacing: 0.04em;
    }

    h1::before {
      width: 9px;
      height: 9px;
      border-radius: 3px;
      background: var(--accent);
      box-shadow: 0 0 18px rgb(32 200 244 / 75%);
      content: "";
    }

    .status {
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgb(10 16 23 / 75%);
    }

    main {
      grid-template-columns: minmax(0, 1.55fr) minmax(380px, 0.85fr);
      gap: 20px;
      width: min(1680px, 100%);
      padding: 20px 24px 32px;
    }

    .panel {
      min-width: 0;
      padding: 18px;
      border: 1px solid rgb(38 57 72 / 82%);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 18px 50px rgb(0 0 0 / 18%);
      backdrop-filter: blur(12px);
    }

    .panel-header {
      height: auto;
      min-height: 28px;
      margin-bottom: 14px;
    }

    .panel-header h2 {
      color: #f4f8fa;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .camera-panel {
      grid-column: 1 / -1;
      padding: 18px 20px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgb(14 25 35 / 96%), rgb(9 16 23 / 94%));
    }

    .camera-state {
      padding: 4px 9px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-size: 11px;
    }

    #camera-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 390px);
      align-items: start;
      gap: 18px;
    }

    .control-grid {
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 10px;
      padding: 0;
    }

    .control-field {
      gap: 6px;
      color: #91a5b4;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.08em;
    }

    .control-field select,
    .control-field input,
    .camera-actions button,
    .apply-button {
      height: 38px;
      border-color: #293d4e;
      border-radius: 8px;
      background: #0a121a;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
    }

    .control-field select:focus,
    .control-field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgb(32 200 244 / 10%);
    }

    .camera-command-column {
      display: grid;
      gap: 8px;
    }

    .camera-actions {
      gap: 8px;
      margin: 0;
    }

    .camera-actions button:hover:not(:disabled),
    .apply-button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    #camera-toggle {
      color: var(--accent);
    }

    #camera-stop {
      color: #f08a92;
    }

    .apply-button {
      height: 38px;
      margin: 0;
      border-color: #1683a2;
      background: #0b5870;
      color: #ecfbff;
      font-weight: 400;
    }

    .camera-message {
      min-height: 16px;
      padding: 0 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .visual {
      border: 1px solid rgb(30 45 57 / 65%);
      border-radius: 10px;
      background: #020406;
    }

    .image-panel {
      align-self: start;
    }

    #camera-image {
      border-radius: 9px;
    }

    .side-column {
      gap: 20px;
    }

    #array-canvas {
      width: 100%;
      border-radius: 9px;
    }

    .histogram-wrap {
      padding: 10px 12px 6px;
      border-color: rgb(38 57 72 / 82%);
      border-radius: 10px;
      background: #081018;
    }

    .stats {
      gap: 20px;
      padding-top: 10px;
    }

    .stats span {
      padding: 4px 7px;
      border-radius: 6px;
      background: rgb(4 9 14 / 55%);
    }

    @media (max-width: 1250px) {
      #camera-form {
        grid-template-columns: 1fr;
      }

      .camera-command-column {
        grid-template-columns: minmax(300px, 420px) minmax(220px, 1fr);
        align-items: start;
      }

      .apply-button {
        grid-column: 2;
        grid-row: 1;
      }

      .camera-message {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 900px) {
      .topbar {
        padding: 0 16px;
      }

      main {
        grid-template-columns: 1fr;
        padding: 14px 16px 24px;
      }

      .side-column {
        grid-template-columns: minmax(0, 1.2fr) minmax(300px, 0.8fr);
      }
    }

    @media (max-width: 700px) {
      header {
        height: 54px;
      }

      .control-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .camera-command-column,
      .side-column {
        grid-template-columns: 1fr;
      }

      .apply-button {
        grid-column: auto;
        grid-row: auto;
      }

      .panel,
      .camera-panel {
        padding: 14px;
        border-radius: 11px;
      }
    }

    /* Editorial workspace */
    :root {
      --page-width: 1440px;
      --rail-width: 286px;
      --page-gutter: clamp(18px, 3vw, 44px);
      --section-gap: clamp(24px, 3vw, 38px);
      --surface: #0c131b;
      --surface-raised: #101923;
      --line: #1c2a36;
      --text: #e9f0f4;
      --muted: #7f919f;
      --accent: #28c7e8;
    }

    body {
      background:
        radial-gradient(circle at 64% -18%, rgb(40 199 232 / 9%), transparent 35rem),
        #070b10;
    }

    header {
      height: 68px;
      border-color: rgb(37 51 63 / 72%);
      background: rgb(7 11 16 / 82%);
    }

    .topbar {
      width: min(var(--page-width), 100%);
      padding-inline: var(--page-gutter);
    }

    h1 {
      gap: 12px;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      box-shadow: 0 0 16px rgb(40 199 232 / 48%);
    }

    .status {
      padding: 7px 12px;
      border-color: rgb(42 58 70 / 72%);
      background: rgb(11 17 24 / 70%);
    }

    main,
    main.dashboard {
      display: grid;
      grid-template-columns: var(--rail-width) minmax(0, 1fr);
      align-items: start;
      justify-content: center;
      gap: var(--section-gap);
      width: min(var(--page-width), 100%);
      margin-inline: auto;
      padding: 38px var(--page-gutter) 64px;
    }

    .control-rail {
      position: sticky;
      top: 106px;
      min-width: 0;
    }

    .workspace {
      display: grid;
      gap: var(--section-gap);
      min-width: 0;
    }

    .panel,
    .camera-panel {
      padding: 24px;
      border: 1px solid rgb(35 50 63 / 76%);
      border-radius: 16px;
      background: rgb(12 19 27 / 90%);
      box-shadow: 0 22px 60px rgb(0 0 0 / 14%);
      backdrop-filter: blur(14px);
    }

    .panel-header {
      min-height: 28px;
      margin-bottom: 22px;
    }

    .panel-header h2 {
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.1em;
    }

    .camera-panel {
      background: linear-gradient(155deg, rgb(16 26 36 / 96%), rgb(10 16 23 / 96%));
    }

    .camera-panel .panel-header {
      align-items: flex-start;
      margin-bottom: 28px;
    }

    .camera-state {
      padding: 4px 8px;
      font-size: 10px;
    }

    #camera-form {
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
    }

    .control-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px 12px;
      padding: 0;
    }

    .control-field:nth-child(1),
    .control-field:nth-child(2),
    .control-field:nth-child(5) {
      grid-column: 1 / -1;
    }

    .slider-field {
      grid-column: 1 / -1;
    }

    .range-control {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 104px;
      align-items: center;
      gap: 14px;
    }

    .range-control input[type="range"] {
      appearance: none;
      width: 100%;
      height: 20px;
      padding: 0;
      border: 0;
      background: transparent;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .range-control input[type="range"]:focus {
      border: 0;
      box-shadow: none;
    }

    .range-control input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 999px;
      background: #263746;
    }

    .range-control input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 16px;
      height: 16px;
      margin-top: -6px;
      border: 3px solid #0c151e;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 1px rgb(40 199 232 / 42%);
    }

    .range-control input[type="range"]::-moz-range-track {
      height: 4px;
      border-radius: 999px;
      background: #263746;
    }

    .range-control input[type="range"]::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border: 3px solid #0c151e;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 1px rgb(40 199 232 / 42%);
    }

    .control-field {
      gap: 7px;
      color: #8fa1af;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.06em;
    }

    .control-field select,
    .control-field input,
    .camera-actions button,
    .apply-button {
      height: 42px;
      border-color: #263746;
      border-radius: 9px;
      background: #091119;
    }

    .camera-command-column {
      display: grid;
      grid-template-columns: 1fr;
      gap: 11px;
    }

    .camera-actions {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 0;
    }

    .camera-actions[data-mode="start"] {
      grid-template-columns: 1fr;
    }

    #camera-toggle {
      border-color: rgb(40 199 232 / 46%);
      background: rgb(40 199 232 / 8%);
    }

    #camera-stop {
      background: rgb(7 12 18 / 74%);
    }

    .apply-button {
      height: 42px;
      margin: 3px 0 0;
      border-color: #187f96;
      background: #0d6175;
    }

    .camera-message {
      min-height: 18px;
      padding: 2px 1px 0;
      overflow: visible;
      line-height: 1.45;
      white-space: normal;
    }

    .image-panel {
      padding: 26px;
    }

    .visual {
      border-color: rgb(31 45 56 / 72%);
      border-radius: 11px;
      background: #030609;
    }

    .image-visual {
      display: flex;
      align-items: center;
      justify-content: center;
      height: clamp(300px, 40vh, 440px);
    }

    #camera-image {
      width: auto;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      border-radius: 10px;
      object-fit: contain;
    }

    .analytics-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
      align-items: stretch;
      gap: var(--section-gap);
    }

    .analytics-grid .panel {
      height: 280px;
      padding: 22px;
    }

    .analytics-grid .panel-header {
      margin-bottom: 14px;
    }

    .array-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .array-wrap {
      height: 158px;
    }

    #array-canvas {
      width: auto;
      height: 100%;
      max-width: 100%;
      border-radius: 10px;
    }

    .histogram-panel {
      display: flex;
      flex-direction: column;
    }

    .histogram-wrap {
      display: grid;
      flex: 1;
      place-items: center;
      padding: 12px 14px 8px;
      border-radius: 11px;
      background: #081018;
    }

    .stats {
      justify-content: flex-start;
      gap: 8px;
      padding-top: 12px;
    }

    .stats span {
      flex: 1;
      padding: 7px 8px;
      text-align: center;
    }

    @media (max-width: 1080px) {
      main,
      main.dashboard {
        grid-template-columns: 1fr;
        padding-top: 26px;
      }

      .control-rail {
        position: static;
      }

      #camera-form {
        grid-template-columns: 1fr;
        align-items: end;
        gap: 24px;
      }

      .control-grid {
        grid-template-columns: repeat(5, minmax(100px, 1fr));
      }

      .control-field:nth-child(1),
      .control-field:nth-child(2),
      .control-field:nth-child(5) {
        grid-column: auto;
      }

      .camera-command-column {
        grid-template-columns: 1fr;
      }

      .apply-button,
      .camera-message {
        grid-column: auto;
        grid-row: auto;
      }
    }

    @media (max-width: 780px) {
      header {
        height: 60px;
      }

      main,
      main.dashboard {
        gap: 22px;
        padding: 20px 16px 40px;
      }

      .workspace {
        gap: 22px;
      }

      #camera-form,
      .analytics-grid {
        grid-template-columns: 1fr;
      }

      .control-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .control-field:nth-child(1),
      .control-field:nth-child(2),
      .control-field:nth-child(5) {
        grid-column: 1 / -1;
      }

      .panel,
      .camera-panel,
      .image-panel,
      .analytics-grid .panel {
        padding: 18px;
        border-radius: 13px;
      }

      .panel-header {
        margin-bottom: 16px;
      }

      .image-visual {
        height: auto;
        aspect-ratio: 4 / 3;
      }

      #camera-image {
        width: 100%;
        height: auto;
      }

      .analytics-grid .panel {
        height: auto;
      }

      .array-wrap {
        height: auto;
        aspect-ratio: 1;
      }

      #array-canvas {
        width: 100%;
        height: auto;
      }
    }

    /* Switchable preview workspace */
    :root {
      --rail-width: 350px;
      --section-gap: 32px;
    }

    .control-rail {
      display: grid;
      gap: 22px;
    }

    .camera-panel {
      padding: 22px;
    }

    .camera-panel .panel-header {
      margin-bottom: 22px;
    }

    #camera-form {
      gap: 22px;
    }

    .control-grid {
      gap: 15px 12px;
    }

    .control-field:nth-child(1),
    .control-field:nth-child(2) {
      grid-column: auto;
    }

    .control-field:nth-child(5) {
      grid-column: 1 / -1;
    }

    .camera-command-column {
      gap: 10px;
    }

    .camera-actions {
      display: flex;
      justify-content: center;
      gap: 36px;
      position: relative;
      margin-top: 30px;
    }

    .camera-actions::before {
      position: absolute;
      top: -20px;
      right: 4px;
      left: 4px;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgb(75 101 119 / 48%) 14%,
        rgb(75 101 119 / 48%) 86%,
        transparent
      );
      content: "";
    }

    .camera-actions button {
      display: grid;
      place-items: center;
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 50%;
    }

    .action-icon {
      display: block;
      color: currentColor;
    }

    #camera-toggle[data-action="start"] .action-icon {
      width: 0;
      height: 0;
      margin-left: 3px;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-left: 12px solid currentColor;
    }

    #camera-toggle[data-action="pause"] .action-icon {
      width: 14px;
      height: 15px;
      background: linear-gradient(
        90deg,
        currentColor 0 4px,
        transparent 4px 10px,
        currentColor 10px 14px
      );
    }

    #camera-toggle[data-action="pending"] .action-icon {
      width: 15px;
      height: 15px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: action-spin 700ms linear infinite;
    }

    #camera-stop .action-icon {
      width: 13px;
      height: 13px;
      border-radius: 2px;
      background: currentColor;
    }

    @keyframes action-spin {
      to { transform: rotate(1turn); }
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    [hidden] {
      display: none !important;
    }

    .preview-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .preview-list .preview-panel {

      flex-direction: column;
      height: 180px;
      padding: 12px;
      border-radius: 13px;

      transition: border-color 160ms ease, transform 160ms ease, background 160ms ease;
    }

    .preview-list .preview-panel:hover,
    .preview-list .preview-panel:focus-visible {
      border-color: rgb(40 199 232 / 55%);
      background: #101a23;
      outline: none;
      transform: translateY(-2px);
    }

    .preview-list .panel-header {
      min-height: 20px;
      margin-bottom: 8px;
    }

    .preview-list .panel-header h2 {
      font-size: 10px;
    }

    .panel-tools {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .download-button {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 1px solid #263746;
      border-radius: 50%;

      transition: border-color 150ms ease, color 150ms ease, background 150ms ease;
    }

    .download-button:hover:not(:disabled),

      background: rgb(40 199 232 / 8%);

    }

    .download-button:disabled {

      opacity: 0.35;
    }

    .download-button svg {

      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;

    .preview-list .download-button {
      width: 24px;
      height: 24px;
    }

    .preview-list .download-button svg {
      width: 13px;
      height: 13px;
    }

    .preview-list .panel-meta,
    .preview-list .stats {
      display: none;
    }

    .preview-list .visual,
    .preview-list .histogram-wrap {
      flex: 1;
      width: 100%;
      min-height: 0;
      height: auto;
      aspect-ratio: auto;
    }

    .preview-list .image-visual,
    .preview-list .array-wrap {
      display: flex;
      align-items: center;
      justify-content: center;

    .preview-list #camera-image,
    .preview-list #array-canvas {

      height: 100%;
      max-width: 100%;
      max-height: 100%;
    }

    .preview-list .histogram-wrap {
      padding: 5px;
    }

    .preview-panel .visual,
    .preview-panel .histogram-wrap {
      border-color: transparent;

    }

    .preview-stage {
      min-width: 0;
    }

    .preview-stage > .preview-panel {

      padding: 26px;
    }

    .preview-stage .panel-header {
      margin-bottom: 22px;
    }

    .preview-stage .image-panel,
    .preview-stage .histogram-panel {
      display: flex;
      flex-direction: column;
    }

    .preview-stage .image-panel {
      align-self: stretch;
    }

    .preview-stage > .image-panel {
      height: min(820px, calc(100vh - 144px));
      min-height: 620px;
    }

    .preview-stage .image-panel .image-visual {
      flex: 1;
      min-height: 0;
      height: auto;
    }

    .preview-stage .image-panel #camera-image {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
    }

    .preview-stage .image-visual,
    .preview-stage .histogram-wrap {
      flex: 1;
      min-height: 0;
      height: auto;
      aspect-ratio: auto;
    }

    .preview-stage .array-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .preview-stage .array-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      height: auto;
    }

    .preview-stage #array-canvas {
      width: min(100%, 680px);
      height: auto;
      max-height: 100%;
    }

    .preview-stage .stats {
      justify-content: center;
    }

    @media (max-width: 1080px) {
      .control-rail {
        position: static;
      }

      .preview-stage > .preview-panel {
        height: 70vh;
        min-height: 520px;
      }
    }

    @media (max-width: 780px) {
      .preview-list {
        gap: 10px;
      }

      .preview-list .preview-panel {
        height: 150px;
        padding: 10px;
      }

      .preview-stage > .preview-panel {
        height: 65vh;
        min-height: 420px;
      }
    }

    @media (min-width: 1081px) {
      .preview-stage > .preview-panel {
        height: 100%;
        min-height: 0;
      }
    }

    .roi-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #8fa1af;
      font-size: 10px;
      letter-spacing: 0.06em;
      cursor: pointer;
    }

    .roi-toggle input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .toggle-track {
      position: relative;
      width: 36px;
      height: 20px;
      border: 1px solid #314657;
      border-radius: 999px;
      background: #101b24;
      transition: border-color 150ms ease, background 150ms ease;
    }

    .toggle-track::after {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #718390;
      content: "";
      transition: transform 150ms ease, background 150ms ease;
    }

    .roi-toggle input:checked + .toggle-track {
      border-color: rgb(40 199 232 / 62%);
      background: rgb(40 199 232 / 14%);
    }

    .roi-toggle input:checked + .toggle-track::after {
      background: var(--accent);
      transform: translateX(16px);
    }

    .roi-toggle input:focus-visible + .toggle-track {
      box-shadow: 0 0 0 3px rgb(32 200 244 / 12%);
    }

    .roi-toggle input:disabled + .toggle-track {
      opacity: 0.45;
    }

    .processing-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 12px;
    }

    .pair-field {
      display: grid;
      gap: 7px;
      min-width: 0;
      color: #8fa1af;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.06em;
    }

    .pair-inputs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    .pair-inputs input {
      width: 100%;
      min-width: 0;
      height: 36px;
      padding: 0 8px;
      border: 1px solid #263746;
      border-radius: 8px;
      outline: none;
      background: #091119;
      color: var(--text);
      font: inherit;
      font-variant-numeric: tabular-nums;
    }

    .pair-inputs input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgb(32 200 244 / 10%);
    }

    .pair-inputs input:disabled {
      cursor: default;
      opacity: 0.45;
    }

    @media (max-width: 420px) {
      .processing-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Control cards and tabbed workspace */
    :root {
      --rail-width: 350px;
      --section-gap: 20px;
      --stage-height: clamp(620px, calc(100vh - 159px), 680px);
    }

    .control-rail {
      display: block;
    }

    #camera-form {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .control-card {
      display: flex;
      flex-direction: column;
      height: calc(61px + var(--stage-height));
      padding: 21px;
    }

    .control-card .panel-header {
      align-items: center;
      margin-bottom: 20px;
    }

    .control-card-footer {
      display: grid;
      gap: 8px;
      margin-top: auto;
      padding-top: 20px;
    }

    .control-card .apply-button {
      width: 100%;
      margin: 0;
    }

    .process-panel {
      background: linear-gradient(155deg, rgb(14 23 32 / 96%), rgb(9 15 22 / 96%));
    }

    .process-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 34px;
      margin-top: 20px;
      margin-bottom: 16px;
      padding-bottom: 4px;
      color: #8fa1af;
      font-size: 10px;
      letter-spacing: 0.06em;
    }

    .process-toggle .roi-toggle {
      flex: 0 0 auto;
    }

    .control-card .processing-grid {
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .workspace {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 15px;
      min-width: 0;
    }

    .workspace-toolbar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 46px;
    }

    .view-bar {
      display: flex;
      align-items: center;
      min-width: 0;
      min-height: 46px;
    }

    .view-tabs {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .view-tabs::-webkit-scrollbar {
      display: none;
    }

    .view-tabs button {
      position: relative;
      flex: 0 0 auto;
      height: 38px;
      padding: 0 17px;
      border: 1px solid rgb(43 61 75 / 76%);
      border-radius: 10px;
      background: rgb(10 18 25 / 70%);
      color: #718694;
      font: inherit;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: color 150ms ease, background 150ms ease, border-color 150ms ease;
    }

    .view-tabs button:hover {
      border-color: rgb(76 102 120 / 76%);
      color: #c4d0d7;
      background: rgb(31 47 59 / 62%);
    }

    .view-tabs button[aria-selected="true"] {
      border-color: rgb(40 199 232 / 28%);
      background: #162631;
      color: #f2f5f7;
      box-shadow: inset 0 0 0 1px rgb(40 199 232 / 18%);
    }

    .view-tab-group {
      position: relative;
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      padding: 0;
      border: 1px solid rgb(43 61 75 / 76%);
      border-radius: 9px;
      background: rgb(10 18 25 / 70%);
      overflow: hidden;
      transition: border-color 150ms ease, background 150ms ease, box-shadow 150ms ease;
    }

    .view-tab-group:hover {
      border-color: rgb(76 102 120 / 76%);
      background: rgb(24 37 47 / 82%);
      box-shadow: 0 0 0 1px rgb(76 102 120 / 12%);
    }

    .view-tab-group:hover > [role="tab"],
    .view-tab-group:hover .tab-download {
      background: transparent;
      color: #c7d3da;
    }

    .view-tab-group:hover .tab-download {
      border-left-color: rgb(76 102 120 / 76%);
    }

    .view-tab-group:has([aria-selected="true"]) {
      border-color: rgb(40 199 232 / 28%);
      background: #162631;
      box-shadow: inset 0 0 0 1px rgb(40 199 232 / 7%);
    }

    .view-tab-group:has([aria-selected="true"]) > [role="tab"] {
      background: transparent;
    }

    .view-tab-group > [role="tab"] {
      height: 36px;
      padding-right: 14px;
      padding-left: 16px;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .view-tab-group .tab-download {
      position: relative;
      display: grid;
      place-items: center;
      flex: 0 0 34px;
      width: 34px;
      height: 36px;
      padding: 0;
      border: 0;
      border-left: 1px solid rgb(81 90 97 / 42%);
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .view-tab-group .tab-download:hover:not(:disabled),
    .view-tab-group .tab-download:focus-visible {
      background: rgb(40 199 232 / 8%);
      color: var(--accent);
      outline: none;
    }

    .view-tab-group .tab-download:disabled {
      cursor: default;
      opacity: 0.35;
    }

    .view-tab-group .tab-download svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .workspace-tools {
      display: flex;
      align-items: center;
    }

    .workspace-tools {
      flex: 0 0 auto;
      gap: 12px;
    }

    .workspace-tools .camera-actions {
      display: flex;
      gap: 8px;
      margin: 0;
    }

    .workspace-tools .camera-actions::before {
      display: none;
    }

    .workspace-tools .camera-actions button,
    .workspace-tools .download-button {
      position: relative;
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 50%;
    }

    .preview-stage {
      position: relative;
      z-index: 1;
      display: grid;
      min-width: 0;
      min-height: 620px;
      height: var(--stage-height);
      gap: var(--section-gap);
    }

    .preview-stage[data-view="overview"] {
      grid-template-columns: minmax(0, 1fr) var(--rail-width);
      grid-template-rows: minmax(0, 1.25fr) minmax(0, 0.75fr);
    }

    .preview-stage > .preview-panel {
      min-width: 0;
      min-height: 0;
      height: auto;
      padding: 20px;
    }

    .preview-stage .panel-header {
      min-height: 24px;
      margin-bottom: 14px;
    }

    .preview-stage[data-view="overview"] .image-panel {
      grid-row: 1 / 3;
    }

    .preview-stage .image-panel,
    .preview-stage .histogram-panel {
      display: flex;
      flex-direction: column;
    }

    .preview-stage .image-visual,
    .preview-stage .histogram-wrap {
      flex: 1;
      min-height: 0;
      height: auto;
      aspect-ratio: auto;
    }

    .preview-stage .image-visual {
      background: transparent;
    }

    .preview-stage .image-panel #camera-image {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
    }

    .preview-stage .array-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .preview-stage .array-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      height: auto;
    }

    .preview-stage #array-canvas {
      width: 100%;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .preview-stage[data-view="overview"] .stats {
      gap: 3px;
      padding-top: 8px;
      font-size: 10px;
    }

    .preview-stage[data-view="overview"] .stats span {
      padding: 4px;
    }

    .preview-stage[data-view="image"] > :not(.image-panel),
    .preview-stage[data-view="array"] > :not(.array-panel),
    .preview-stage[data-view="histogram"] > :not(.histogram-panel) {
      display: none;
    }

    .preview-stage:not([data-view="overview"]) {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
    }

    .preview-stage:not([data-view="overview"]) > .preview-panel {
      height: 100%;
      padding: 26px;
    }

    .preview-stage[data-view="array"] #array-canvas {
      width: min(100%, 720px);
      height: auto;
    }

    .preview-stage[data-view="array"] .stats {
      justify-content: center;
    }

    @media (max-width: 1080px) {
      #camera-form {
        grid-template-columns: 1fr;
      }

      .control-rail {
        position: static;
      }

      .control-card {
        height: auto;
      }

      .preview-stage {
        height: 680px;
        min-height: 0;
      }
    }

    @media (max-width: 780px) {
      #camera-form,
      .preview-stage[data-view="overview"] {
        grid-template-columns: 1fr;
      }

      .workspace-toolbar {
        align-items: flex-end;
        flex-wrap: wrap;
        gap: 6px;
      }

        width: 100%;

      }

        height: auto;
      }

      }

        grid-row: auto;
      }

      .preview-stage:not([data-view="overview"]) {
        height: 65vh;
        min-height: 440px;
      }
    }

<body>
  <header>
    <div class="topbar">
      <h1>CCD Monitor</h1>
      <div id="status" class="status" data-state="disconnected">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="status-text">等待数据</span>
      </div>
    </div>
  </header>

  <main class="dashboard">
    <aside class="control-rail">
      <form id="camera-form">
        <section class="panel camera-panel control-card">
          <div class="panel-header">
            <h2>Control</h2>
            <span id="camera-state" class="panel-meta camera-state" data-state="loading">检查中</span>
          </div>

          <div class="control-grid">
            <label class="control-field">
              Format
              <select id="camera-format" name="format" disabled>
                <option value="BayerRG8">BayerRG8</option>
                <option value="BayerRG12">BayerRG12</option>
              </select>
            </label>

            <label class="control-field">
              Frame rate (fps)
              <input id="camera-frame-rate" name="frame_rate" type="number" min="0.01" step="0.01" required disabled>
            </label>

            <label class="control-field slider-field">
              <span>Height</span>
              <span class="range-control">
                <input id="camera-height-range" type="range" min="2304" max="3072" step="16" aria-label="Height slider" disabled>
                <input id="camera-height" name="height" type="number" min="2304" max="3072" step="16" required disabled>
              </span>
            </label>

            <label class="control-field slider-field">
              <span>Width</span>
              <span class="range-control">
                <input id="camera-width-range" type="range" min="3072" max="4096" step="16" aria-label="Width slider" disabled>
                <input id="camera-width" name="width" type="number" min="3072" max="4096" step="16" required disabled>
              </span>
            </label>

            <label class="control-field slider-field">
              <span>Exposure (μs)</span>
              <span class="range-control">
                <input id="camera-exposure-range" type="range" min="0" max="1000" step="1" aria-label="Exposure slider" disabled>
                <input id="camera-exposure" name="exposure" type="number" min="37" max="1000000" step="any" required disabled>
              </span>
            </label>
          </div>

          <div class="process-toggle">
            <span>Show ROI outline</span>
            <label class="roi-toggle" aria-label="Show ROI outline">
              <input id="roi-display" name="roi_display" type="checkbox" disabled>
              <span class="toggle-track" aria-hidden="true"></span>
            </label>
          </div>

          <div class="processing-grid">
            <label class="pair-field">
              <span>Origin · row / col</span>
              <span class="pair-inputs">
                <input id="roi-row" name="roi_row" type="number" min="0" max="3071" step="1" required aria-label="ROI row" disabled>
                <input id="roi-col" name="roi_col" type="number" min="0" max="4095" step="1" required aria-label="ROI column" disabled>
              </span>
            </label>

            <label class="pair-field">
              <span>ROI size · h / w</span>
              <span class="pair-inputs">
                <input id="roi-height" name="roi_height" type="number" min="1" max="3072" step="1" required aria-label="ROI height" disabled>
                <input id="roi-width" name="roi_width" type="number" min="1" max="4096" step="1" required aria-label="ROI width" disabled>
              </span>
            </label>

            <label class="pair-field">
              <span>Array size · h / w</span>
              <span class="pair-inputs">
                <input id="array-height" name="array_height" type="number" min="1" max="3072" step="1" required aria-label="Array height" disabled>
                <input id="array-width" name="array_width" type="number" min="1" max="4096" step="1" required aria-label="Array width" disabled>
              </span>
            </label>
          </div>

          <div class="control-card-footer">
            <button id="camera-apply" class="apply-button" type="submit" disabled>应用参数</button>
            <p id="camera-message" class="camera-message" aria-live="polite"></p>
          </div>
        </section>
      </form>

    </aside>

    <section class="workspace" aria-label="CCD views">
      <div class="workspace-toolbar">
        <div class="view-bar">
          <nav class="view-tabs" role="tablist" aria-label="视图切换">
            <button type="button" role="tab" data-view="overview" aria-selected="true">Overview</button>
            <span class="view-tab-group" role="presentation">
              <button type="button" role="tab" data-view="image" aria-selected="false">Image</button>
              <button id="image-download" class="tab-download" type="button" aria-label="下载当前 Image" title="下载 Image" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14"/>
                </svg>
              </button>
            </span>
            <span class="view-tab-group" role="presentation">
              <button type="button" role="tab" data-view="array" aria-selected="false">Array</button>
              <button id="array-download" class="tab-download" type="button" aria-label="下载当前 Array" title="下载 Array" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14"/>
                </svg>
              </button>
            </span>
            <button type="button" role="tab" data-view="histogram" aria-selected="false">Histogram</button>
          </nav>
        </div>

        <div class="workspace-tools">
          <div class="camera-actions" data-mode="start">
            <button id="camera-toggle" type="button" data-action="start" aria-label="启动" title="启动" disabled>
              <span class="action-icon" aria-hidden="true"></span>
              <span id="camera-toggle-label" class="visually-hidden">启动</span>
            </button>
            <button id="camera-stop" type="button" aria-label="停止" title="停止" disabled hidden>
              <span class="action-icon" aria-hidden="true"></span>
              <span class="visually-hidden">停止</span>
            </button>
          </div>
        </div>
      </div>

      <div id="preview-stage" class="preview-stage" data-view="overview" aria-live="polite">
        <section class="panel preview-panel image-panel" data-preview="image">
          <div class="panel-header">
            <h2>Image</h2>
            <span id="image-meta" class="panel-meta">—</span>
          </div>
          <div class="visual image-visual">
            <img id="camera-image" alt="CCD 实时图像">
          </div>
        </section>

        <section class="panel preview-panel array-panel" data-preview="array">
          <div class="panel-header">
            <h2>Array</h2>
            <span id="array-meta" class="panel-meta">—</span>
          </div>
          <div class="visual array-wrap">
            <canvas id="array-canvas" width="32" height="32"></canvas>
          </div>
          <div class="stats">
            <span>Min <span id="array-min" class="stat-value">—</span></span>
            <span>Mean <span id="array-mean" class="stat-value">—</span></span>
            <span>Max <span id="array-max" class="stat-value">—</span></span>
          </div>
        </section>

        <section class="panel preview-panel histogram-panel" data-preview="histogram">
          <div class="panel-header">
            <h2>Histogram</h2>
            <span id="histogram-meta" class="panel-meta">64 bins · 0–255</span>
          </div>
          <div class="histogram-wrap">
            <canvas id="histogram-canvas" width="640" height="210"></canvas>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    const cameraImage = document.querySelector('#camera-image');
    const arrayCanvas = document.querySelector('#array-canvas');
    const arrayContext = arrayCanvas.getContext('2d');
    const histogramCanvas = document.querySelector('#histogram-canvas');
    const histogramContext = histogramCanvas.getContext('2d');
    const imageDownload = document.querySelector('#image-download');
    const arrayDownload = document.querySelector('#array-download');
    const status = document.querySelector('#status');
    const statusText = document.querySelector('#status-text');
    const cameraForm = document.querySelector('#camera-form');
    const cameraStateText = document.querySelector('#camera-state');
    const cameraMessage = document.querySelector('#camera-message');
    const cameraFormat = document.querySelector('#camera-format');
    const cameraHeight = document.querySelector('#camera-height');
    const cameraHeightRange = document.querySelector('#camera-height-range');
    const cameraWidth = document.querySelector('#camera-width');
    const cameraWidthRange = document.querySelector('#camera-width-range');
    const cameraExposure = document.querySelector('#camera-exposure');
    const cameraExposureRange = document.querySelector('#camera-exposure-range');
    const cameraFrameRate = document.querySelector('#camera-frame-rate');
    const roiDisplay = document.querySelector('#roi-display');
    const roiRow = document.querySelector('#roi-row');
    const roiCol = document.querySelector('#roi-col');
    const roiHeight = document.querySelector('#roi-height');
    const roiWidth = document.querySelector('#roi-width');
    const arrayHeight = document.querySelector('#array-height');
    const arrayWidth = document.querySelector('#array-width');
    const cameraActions = document.querySelector('.camera-actions');
    const cameraToggle = document.querySelector('#camera-toggle');
    const cameraToggleLabel = document.querySelector('#camera-toggle-label');
    const cameraStop = document.querySelector('#camera-stop');
    const cameraApplyButtons = [...document.querySelectorAll('.apply-button')];
    const viewTabs = document.querySelector('.view-tabs');
    const previewStage = document.querySelector('#preview-stage');
    const cameraFields = [
      cameraFormat,
      cameraHeight,
      cameraHeightRange,
      cameraWidth,
      cameraWidthRange,
      cameraExposure,
      cameraExposureRange,
      cameraFrameRate,
      roiDisplay,
      roiRow,
      roiCol,
      roiHeight,
      roiWidth,
      arrayHeight,
      arrayWidth,
    ];
    const cameraSliders = [
      { number: cameraHeight, range: cameraHeightRange, scale: 'linear' },
      { number: cameraWidth, range: cameraWidthRange, scale: 'linear' },
      { number: cameraExposure, range: cameraExposureRange, scale: 'log' },
    ];
    let objectUrl = null;
    let latestImageSource = null;
    let latestArray = null;
    let cameraStatus = null;
    let cameraPending = false;
    let cameraDirty = false;
    let cameraRevision = 0;

    function setConnectionState(connected, text = connected ? '数据已连接' : '等待数据') {
      status.dataset.state = connected ? 'connected' : 'disconnected';
      statusText.textContent = text;
    }

    function cameraErrorMessage(payload, fallback) {
      const detail = payload?.detail;
      if (typeof detail === 'string') return detail;
      if (Array.isArray(detail)) {
        return detail.map((item) => item.msg || String(item)).join('; ');
      }
      return fallback;
    }

    async function cameraRequest(path, options = {}) {
      const response = await fetch(path, {
        cache: 'no-store',
        ...options,
      });
      const contentType = response.headers.get('Content-Type') || '';
      let payload = null;

      if (contentType.includes('application/json')) {
        payload = await response.json();
      } else {
        const text = await response.text();
        payload = text ? { detail: text } : null;
      }

      if (!response.ok) {
        throw new Error(cameraErrorMessage(payload, `请求失败 (${response.status})`));
      }
      return payload;
    }

    function setCameraMessage(text = '', error = false) {
      cameraMessage.textContent = text;
      cameraMessage.dataset.state = error ? 'error' : 'normal';
    }

    function syncRangeFromNumber(control) {
      const value = Number(control.number.value);
      if (!Number.isFinite(value)) return;

      const minimum = Number(control.number.min);
      const maximum = Number(control.number.max);
      const clamped = Math.max(minimum, Math.min(maximum, value));
      if (control.scale === 'log') {
        const ratio = Math.log(clamped / minimum) / Math.log(maximum / minimum);
        const rangeMinimum = Number(control.range.min);
        const rangeMaximum = Number(control.range.max);
        control.range.value = rangeMinimum + ratio * (rangeMaximum - rangeMinimum);
      } else {
        control.range.value = clamped;
      }
    }

    function syncNumberFromRange(control) {
      if (control.scale === 'log') {
        const rangeMinimum = Number(control.range.min);
        const rangeMaximum = Number(control.range.max);
        const ratio = (Number(control.range.value) - rangeMinimum) /
          (rangeMaximum - rangeMinimum);
        const minimum = Number(control.number.min);
        const maximum = Number(control.number.max);
        control.number.value = Math.round(minimum * (maximum / minimum) ** ratio);
      } else {
        control.number.value = control.range.value;
      }
    }

    for (const control of cameraSliders) {
      control.range.addEventListener('input', () => syncNumberFromRange(control));
      control.number.addEventListener('input', () => syncRangeFromNumber(control));
    }

    function normalizeFrameRate() {
      if (cameraFrameRate.value.trim() === '') return;
      const value = Number(cameraFrameRate.value);
      if (Number.isFinite(value)) cameraFrameRate.value = value.toFixed(2);
    }

    cameraFrameRate.addEventListener('change', normalizeFrameRate);

    function validateProcessingGeometry() {
      for (const field of [roiRow, roiCol, roiHeight, roiWidth, arrayHeight, arrayWidth]) {
        field.setCustomValidity('');
      }

      const imageHeight = Number(cameraHeight.value);
      const imageWidth = Number(cameraWidth.value);
      const row = Number(roiRow.value);
      const col = Number(roiCol.value);
      const height = Number(roiHeight.value);
      const width = Number(roiWidth.value);
      const rows = Number(arrayHeight.value);
      const cols = Number(arrayWidth.value);

      if (![imageHeight, imageWidth, row, col, height, width, rows, cols].every(Number.isFinite)) {
        return;
      }

      roiRow.max = Math.max(0, imageHeight - 1);
      roiCol.max = Math.max(0, imageWidth - 1);
      roiHeight.max = Math.max(1, imageHeight - row);
      roiWidth.max = Math.max(1, imageWidth - col);
      arrayHeight.max = Math.max(1, height);
      arrayWidth.max = Math.max(1, width);

      if (row + height > imageHeight) {
        roiHeight.setCustomValidity('ROI 高度超出图像范围');
      }
      if (col + width > imageWidth) {
        roiWidth.setCustomValidity('ROI 宽度超出图像范围');
      }
      if (rows > height) {
        arrayHeight.setCustomValidity('阵列高度不能大于 ROI 高度');
      }
      if (cols > width) {
        arrayWidth.setCustomValidity('阵列宽度不能大于 ROI 宽度');
      }

    }

    function updateCameraControls() {
      const ready = cameraStatus !== null;
      for (const field of cameraFields) {
        field.disabled = !ready || cameraPending;
      }
      if (ready) {
        const toggleLabel = cameraPending
          ? '处理中…'
          : cameraStatus.running
            ? '暂停'
            : cameraStatus.opened
              ? '继续'
              : '启动';
        cameraToggle.dataset.action = cameraPending
          ? 'pending'
          : cameraStatus.running ? 'pause' : 'start';
        cameraToggleLabel.textContent = toggleLabel;
        cameraToggle.setAttribute('aria-label', toggleLabel);
        cameraToggle.title = toggleLabel;
      }
      cameraToggle.disabled = !ready || cameraPending;
      cameraActions.dataset.mode = ready && cameraStatus.opened ? 'session' : 'start';
      cameraStop.hidden = !ready || !cameraStatus.opened;
      cameraStop.disabled = !ready || cameraPending || !cameraStatus.opened;
      for (const button of cameraApplyButtons) {
        button.disabled = !ready || cameraPending || !cameraDirty;
      }
    }

    function renderCameraStatus(nextStatus, syncForm = true) {
      cameraStatus = nextStatus;

      if (nextStatus.running) {
        cameraStateText.dataset.state = 'running';
        cameraStateText.textContent = '运行中';
      } else if (nextStatus.opened) {
        cameraStateText.dataset.state = 'paused';
        cameraStateText.textContent = '已暂停';
      } else {
        cameraStateText.dataset.state = 'closed';
        cameraStateText.textContent = '已结束';
      }

      if (syncForm) {
        cameraFormat.value = nextStatus.format;
        [cameraHeight.value, cameraWidth.value] = nextStatus.size;
        cameraExposure.value = nextStatus.exposure;
        cameraFrameRate.value = Number(nextStatus.frame_rate).toFixed(2);
        roiDisplay.checked = nextStatus.roi_display;
        [roiRow.value, roiCol.value] = nextStatus.roi_origin;
        [roiHeight.value, roiWidth.value] = nextStatus.roi_size;
        [arrayHeight.value, arrayWidth.value] = nextStatus.array_size;
        for (const control of cameraSliders) syncRangeFromNumber(control);
        validateProcessingGeometry();
        cameraDirty = false;
      }
      updateCameraControls();
    }

    function renderCameraError(error) {
      cameraStateText.dataset.state = 'error';
      cameraStateText.textContent = '状态异常';
      setCameraMessage(error.message || String(error), true);
    }

    async function refreshCameraStatus(showError = false) {
      if (cameraPending) return;
      const revision = cameraRevision;

      try {
        const nextStatus = await cameraRequest('/api/camera');
        if (revision !== cameraRevision || cameraPending) return;
        renderCameraStatus(nextStatus, !cameraDirty);
      } catch (error) {
        if (revision !== cameraRevision || cameraPending) return;
        if (showError) renderCameraError(error);
      }
    }

    async function runCameraAction(path, options = {}, behavior = {}) {
      const {
        syncForm = true,
        successMessage = '操作成功',
      } = behavior;
      let successful = false;

      cameraRevision += 1;
      cameraPending = true;
      setCameraMessage('正在执行…');
      updateCameraControls();

      try {
        const nextStatus = await cameraRequest(path, options);
        renderCameraStatus(nextStatus, syncForm);
        setCameraMessage(successMessage);
        successful = true;
      } catch (error) {
        try {
          const nextStatus = await cameraRequest('/api/camera');
          renderCameraStatus(nextStatus, false);
          setCameraMessage(error.message || String(error), true);
        } catch {
          renderCameraError(error);
        }
      } finally {
        cameraPending = false;
        updateCameraControls();
      }
      return successful;
    }

    cameraForm.addEventListener('input', (event) => {
      if (event.target === roiDisplay) return;
      validateProcessingGeometry();
      cameraDirty = true;
      setCameraMessage('参数尚未应用');
      updateCameraControls();
    });

    roiDisplay.addEventListener('change', async () => {
      const hadPendingChanges = cameraDirty;
      const successful = await runCameraAction('/api/camera/config', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ roi_display: roiDisplay.checked }),
      }, {
        syncForm: false,
        successMessage: hadPendingChanges
          ? 'ROI 显示已更新；其他参数尚未应用'
          : 'ROI 显示已更新',
      });

      if (!successful && cameraStatus) {
        roiDisplay.checked = cameraStatus.roi_display;
      }
    });

    cameraForm.addEventListener('submit', (event) => {
      event.preventDefault();
      normalizeFrameRate();
      validateProcessingGeometry();
      if (!cameraForm.reportValidity()) return;

      runCameraAction('/api/camera/config', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          format: cameraFormat.value,
          size: [Number(cameraHeight.value), Number(cameraWidth.value)],
          exposure: Number(cameraExposure.value),
          frame_rate: Number(cameraFrameRate.value),
          roi_display: roiDisplay.checked,
          roi_origin: [Number(roiRow.value), Number(roiCol.value)],
          roi_size: [Number(roiHeight.value), Number(roiWidth.value)],
          array_size: [Number(arrayHeight.value), Number(arrayWidth.value)],
        }),
      });
    });

    cameraToggle.addEventListener('click', () => {
      if (!cameraStatus) return;
      const action = cameraStatus.running ? 'pause' : 'start';
      runCameraAction(`/api/camera/${action}`, { method: 'POST' });
    });
    cameraStop.addEventListener('click', () => {
      runCameraAction('/api/camera/stop', { method: 'POST' });
    });

    function setImage(source) {
      if (!source) return;
      latestImageSource = source;
      imageDownload.disabled = false;

      if (objectUrl) {
        URL.revokeObjectURL(objectUrl);
        objectUrl = null;
      }

      if (source instanceof Blob) {
        objectUrl = URL.createObjectURL(source);
        cameraImage.src = objectUrl;
      } else {
        cameraImage.src = source;
      }
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.append(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function downloadTimestamp() {
      return new Date().toISOString().replace(/[:.]/g, '-');
    }

    imageDownload.addEventListener('click', async (event) => {
      event.stopPropagation();
      if (!latestImageSource) return;

      try {
        const blob = latestImageSource instanceof Blob
          ? latestImageSource
          : await fetch(latestImageSource).then((response) => response.blob());
        downloadBlob(blob, `ccd-image-${downloadTimestamp()}.jpg`);
      } catch (error) {
        console.error('Image download failed', error);
      }
    });

    arrayDownload.addEventListener('click', (event) => {
      event.stopPropagation();
      if (!latestArray) return;

      const lines = [];
      for (let row = 0; row < latestArray.rows; row += 1) {
        const begin = row * latestArray.columns;
        lines.push(latestArray.values.slice(begin, begin + latestArray.columns).join(','));
      }
      const blob = new Blob([`\uFEFF${lines.join('\r\n')}`], {
        type: 'text/csv;charset=utf-8',
      });
      downloadBlob(blob, `ccd-array-${downloadTimestamp()}.csv`);
    });

    function setActiveView(view) {
      previewStage.dataset.view = view;
      for (const tab of viewTabs.querySelectorAll('[data-view]')) {
        tab.setAttribute('aria-selected', String(tab.dataset.view === view));
      }
      window.requestAnimationFrame(drawHistogram);
    }

    viewTabs.addEventListener('click', (event) => {
      const tab = event.target.closest('[data-view]');
      if (tab) setActiveView(tab.dataset.view);
    });

    viewTabs.addEventListener('keydown', (event) => {
      if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
      const tabs = [...viewTabs.querySelectorAll('[data-view]')];
      const current = tabs.indexOf(document.activeElement);
      if (current < 0) return;
      event.preventDefault();
      const step = event.key === 'ArrowRight' ? 1 : -1;
      const next = tabs[(current + step + tabs.length) % tabs.length];
      next.focus();
      setActiveView(next.dataset.view);
    });

    const parulaColors = [
      [53, 42, 135],
      [15, 92, 164],
      [18, 125, 165],
      [7, 156, 154],
      [21, 177, 126],
      [89, 189, 88],
      [165, 190, 51],
      [225, 185, 39],
      [249, 251, 14],
    ];

    function heatColor(value) {
      const normalized = Math.max(0, Math.min(1, Number(value) / 255));
      const position = normalized * (parulaColors.length - 1);
      const index = Math.min(parulaColors.length - 2, Math.floor(position));
      const ratio = position - index;
      const start = parulaColors[index];
      const end = parulaColors[index + 1];
      const color = start.map((channel, channelIndex) =>
        Math.round(channel + (end[channelIndex] - channel) * ratio)
      );
      return `rgb(${color[0]} ${color[1]} ${color[2]})`;
    }

    const histogramBinCount = 64;
    let histogramCounts = new Uint32Array(histogramBinCount);

    function drawHistogram() {
      const bounds = histogramCanvas.getBoundingClientRect();
      if (!bounds.width || !bounds.height) return;

      const pixelRatio = window.devicePixelRatio || 1;
      const pixelWidth = Math.max(1, Math.round(bounds.width * pixelRatio));
      const pixelHeight = Math.max(1, Math.round(bounds.height * pixelRatio));
      if (histogramCanvas.width !== pixelWidth) histogramCanvas.width = pixelWidth;
      if (histogramCanvas.height !== pixelHeight) histogramCanvas.height = pixelHeight;

      const width = bounds.width;
      const height = bounds.height;
      const compact = width < 260;
      const plot = compact
        ? { left: 10, right: 5, top: 7, bottom: 13 }
        : { left: 48, right: 16, top: 20, bottom: 34 };
      const plotWidth = Math.max(1, width - plot.left - plot.right);
      const plotHeight = Math.max(1, height - plot.top - plot.bottom);
      const maxCount = Math.max(1, ...histogramCounts);

      histogramContext.setTransform(1, 0, 0, 1, 0, 0);
      histogramContext.clearRect(0, 0, pixelWidth, pixelHeight);
      histogramContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

      histogramContext.strokeStyle = 'rgb(255 255 255 / 7%)';
      histogramContext.lineWidth = 1;
      for (let line = 0; line <= 4; line += 1) {
        const y = plot.top + plotHeight * line / 4 + 0.5;
        histogramContext.beginPath();
        histogramContext.moveTo(plot.left, y);
        histogramContext.lineTo(width - plot.right, y);
        histogramContext.stroke();
      }

      const gap = compact ? 1 : 2;
      const barWidth = plotWidth / histogramBinCount;
      histogramContext.fillStyle = '#029dce';
      histogramCounts.forEach((count, index) => {
        const barHeight = count / maxCount * plotHeight;
        histogramContext.fillRect(
          plot.left + index * barWidth + gap / 2,
          plot.top + plotHeight - barHeight,
          Math.max(1, barWidth - gap),
          barHeight,
        );
      });

      if (!compact) {
        histogramContext.fillStyle = '#8294a2';
        histogramContext.font = '12px system-ui, sans-serif';
        histogramContext.textBaseline = 'top';
        histogramContext.textAlign = 'left';
        histogramContext.fillText('0', plot.left, height - 22);
        histogramContext.textAlign = 'center';
        histogramContext.fillText('128', plot.left + plotWidth / 2, height - 22);
        histogramContext.textAlign = 'right';
        histogramContext.fillText('255', width - plot.right, height - 22);
        histogramContext.textBaseline = 'middle';
        histogramContext.fillText(String(maxCount), plot.left - 8, plot.top);
      }
    }

    function setHistogram(values) {
      histogramCounts = new Uint32Array(histogramBinCount);
      for (const value of values) {
        const normalized = Math.max(0, Math.min(255, Number(value)));
        const index = Math.min(
          histogramBinCount - 1,
          Math.floor(normalized / 256 * histogramBinCount),
        );
        histogramCounts[index] += 1;
      }

      document.querySelector('#histogram-meta').textContent =
        `${histogramBinCount} bins · ${values.length} samples`;
      drawHistogram();
    }

    new ResizeObserver(() => {
      window.requestAnimationFrame(drawHistogram);
    }).observe(histogramCanvas);

    function setArray(values, height = null, width = null) {
      if (!values || values.length === 0) return;

      const nested = Array.isArray(values) && Array.isArray(values[0]);
      const rows = nested ? values : null;
      const flat = nested ? rows.flat().map(Number) : values;
      height ??= nested ? rows.length : 1;
      width ??= nested ? rows[0].length : flat.length;
      latestArray = {
        values: Array.from(flat, Number),
        rows: height,
        columns: width,
      };
      arrayDownload.disabled = false;

      arrayCanvas.width = width;
      arrayCanvas.height = height;

      for (let y = 0; y < height; y += 1) {
        for (let x = 0; x < width; x += 1) {
          arrayContext.fillStyle = heatColor(Number(flat[y * width + x]));
          arrayContext.fillRect(x, y, 1, 1);
        }
      }

      const min = Math.min(...flat);
      const max = Math.max(...flat);
      const mean = flat.reduce((sum, value) => sum + value, 0) / flat.length;

      document.querySelector('#array-meta').textContent = `${height} × ${width}`;
      document.querySelector('#array-min').textContent = min.toFixed(2);
      document.querySelector('#array-mean').textContent = mean.toFixed(2);
      document.querySelector('#array-max').textContent = max.toFixed(2);
      setHistogram(flat);
    }

    function updateView({
      image,
      array,
      arrayRows = null,
      arrayColumns = null,
      frameId = null,
      timestamp = null,
    }) {
      setImage(image);
      setArray(array, arrayRows, arrayColumns);
      setConnectionState(true);

      const details = [];
      if (frameId !== null) details.push(`#${frameId}`);
      if (timestamp !== null) details.push(new Date(timestamp).toLocaleTimeString());
      document.querySelector('#image-meta').textContent = details.join(' · ') || 'LIVE';
    }

    // Integration point for tests and alternate transports.
    window.ccdView = { update: updateView, setConnectionState };

    function decodePacket(buffer) {
      const headerSize = 20;
      if (buffer.byteLength < headerSize) throw new Error('packet is too short');

      const view = new DataView(buffer);
      const frameId = view.getUint32(0, true);
      const timestamp = view.getFloat64(4, true);
      const rows = view.getUint16(12, true);
      const columns = view.getUint16(14, true);
      const jpegSize = view.getUint32(16, true);
      const arraySize = rows * columns * Float32Array.BYTES_PER_ELEMENT;
      const jpegOffset = headerSize + arraySize;

      if (jpegOffset + jpegSize !== buffer.byteLength) {
        throw new Error('packet size mismatch');
      }

      const array = new Float32Array(buffer.slice(headerSize, jpegOffset));
      const image = new Blob(
        [buffer.slice(jpegOffset, jpegOffset + jpegSize)],
        { type: 'image/jpeg' },
      );

      return {
        image,
        array,
        arrayRows: rows,
        arrayColumns: columns,
        frameId,
        timestamp,
      };
    }

    function connect() {
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      const socket = new WebSocket(`${scheme}://${location.host}/ws`);
      socket.binaryType = 'arraybuffer';

      socket.addEventListener('open', () => {
        setConnectionState(true, '等待图像');
      });

      socket.addEventListener('message', (event) => {
        try {
          updateView(decodePacket(event.data));
        } catch (error) {
          console.error(error);
          setConnectionState(false, '数据格式错误');
        }
      });

      socket.addEventListener('close', () => {
        setConnectionState(false, '连接断开，正在重试');
        window.setTimeout(connect, 1500);
      });

      socket.addEventListener('error', () => socket.close());
    }

    function showDemo() {
      const cameraHeight = 3072;
      const cameraWidth = 4096;
      const roiRow = 768;
      const roiColumn = 1024;
      const roiHeight = 1536;
      const roiWidth = 2048;
      const blockSize = 32;
      const grayLevels = [0, 85, 170, 255];
      const maxOffset = 4;
      const noiseAmplitude = 3;
      const fadeWidth = 384;
      const darkLevel = 3;
      const imageBlockHeight = cameraHeight / blockSize;
      const imageBlockWidth = cameraWidth / blockSize;
      const arrayHeight = roiHeight / blockSize;
      const arrayWidth = roiWidth / blockSize;
      const offsetRow = Math.floor(Math.random() * (2 * maxOffset + 1)) - maxOffset;
      const offsetColumn = Math.floor(Math.random() * (2 * maxOffset + 1)) - maxOffset;
      const imageValues = Array.from({ length: imageBlockHeight }, () =>
        Array.from({ length: imageBlockWidth }, () =>
          grayLevels[Math.floor(Math.random() * grayLevels.length)]
        )
      );

      const demoCanvas = document.createElement('canvas');
      demoCanvas.height = cameraHeight;
      demoCanvas.width = cameraWidth;
      const context = demoCanvas.getContext('2d');
      context.fillStyle = `rgb(${darkLevel} ${darkLevel} ${darkLevel})`;
      context.fillRect(0, 0, cameraWidth, cameraHeight);

      const regionRow = roiRow - fadeWidth;
      const regionColumn = roiColumn - fadeWidth;
      const regionHeight = roiHeight + 2 * fadeWidth;
      const regionWidth = roiWidth + 2 * fadeWidth;
      const imageData = context.createImageData(regionWidth, regionHeight);
      const sums = new Float64Array(arrayHeight * arrayWidth);

      function edgeFade(position, begin, end) {
        if (position < begin) {
          const x = (position - begin + fadeWidth) / fadeWidth;
          return x * x * (3 - 2 * x);
        }
        if (position >= end) {
          const x = (end + fadeWidth - position) / fadeWidth;
          return x * x * (3 - 2 * x);
        }
        return 1;
      }

      let pixel = 0;
      for (let localRow = 0; localRow < regionHeight; localRow += 1) {
        const imageRow = regionRow + localRow;
        const fadeY = edgeFade(imageRow, roiRow, roiRow + roiHeight);
        const blockRow = Math.floor((imageRow - offsetRow) / blockSize);

        for (let localColumn = 0; localColumn < regionWidth; localColumn += 1) {
          const imageColumn = regionColumn + localColumn;
          const fadeX = edgeFade(imageColumn, roiColumn, roiColumn + roiWidth);
          const blockColumn = Math.floor((imageColumn - offsetColumn) / blockSize);
          const base = imageValues[blockRow][blockColumn];
          const noise = (2 * Math.random() - 1) * noiseAmplitude;
          const fade = fadeY * fadeX;
          const value = Math.max(
            0,
            Math.min(255, Math.round(darkLevel + (base + noise - darkLevel) * fade)),
          );

          imageData.data[pixel] = value;
          imageData.data[pixel + 1] = value;
          imageData.data[pixel + 2] = value;
          imageData.data[pixel + 3] = 255;
          pixel += 4;

          if (
            imageRow >= roiRow && imageRow < roiRow + roiHeight &&
            imageColumn >= roiColumn && imageColumn < roiColumn + roiWidth
          ) {
            const arrayRow = Math.floor((imageRow - roiRow) / blockSize);
            const arrayColumn = Math.floor((imageColumn - roiColumn) / blockSize);
            sums[arrayRow * arrayWidth + arrayColumn] += value;
          }
        }
      }
      context.putImageData(imageData, regionColumn, regionRow);

      const pixelsPerCell = blockSize * blockSize;
      const values = Array.from({ length: arrayHeight }, (_, row) =>
        Array.from({ length: arrayWidth }, (_, column) =>
          sums[row * arrayWidth + column] / pixelsPerCell
        )
      );

      updateView({
        image: demoCanvas.toDataURL('image/jpeg', 0.9),
        array: values,
        arrayRows: arrayHeight,
        arrayColumns: arrayWidth,
        frameId: 0,
        timestamp: Date.now(),
      });
      setConnectionState(false, '演示数据');
    }

    if (location.protocol === 'file:') {
      showDemo();
      cameraStateText.dataset.state = 'closed';
      cameraStateText.textContent = '仅服务器可用';
      setCameraMessage('请通过服务地址打开此页面');
    } else {
      connect();
      refreshCameraStatus(true);
      window.setInterval(refreshCameraStatus, 3000);
    }
  </script>
</body>
</html>
